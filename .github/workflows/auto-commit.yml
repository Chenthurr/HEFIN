name: Repository Maintenance

on:
  schedule:
    - cron: '30 12 * * *'
    - cron: '30 14 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record maintenance run
        run: |
          mkdir -p .github
          {
            echo "# Automated Maintenance"
            echo
            echo "This file records scheduled repository-maintenance runs."
            echo
            echo "- Last run (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Workflow run: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
          } > .github/maintenance-status.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/maintenance-status.md
          git diff --cached --quiet || git commit -m "chore: update maintenance status"
          git push
