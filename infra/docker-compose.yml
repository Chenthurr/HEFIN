version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hefin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hefin
      POSTGRES_PASSWORD: hefin_dev_password
      POSTGRES_DB: hefin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hefin"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hefin_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: hefin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: hefin_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hefin
      MINIO_ROOT_PASSWORD: hefin_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  qdrantdata:
  redisdata:
  miniodata:
